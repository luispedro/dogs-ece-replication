# Characterised origin sequences searched directly in the DNA (RNA-initiated
# replicons carry no initiator protein, so they are invisible to protein searches).
origin_motifs:
  ColE1_RNAI_RNAII:
    sequence: TTGAAGTGGTGGCCTAACTACGGCTACACTAGAAG
    max_mismatches: 6
    mechanisms: [theta]
    specificity: medium
    family: "ColE1/pMB1-type RNA-primed origin (RNAI/RNAII overlap region)"
    support: "Conserved region of ColE1-type origins (Tomizawa 1986; Cesareni et al. 1991); found at ColE1 pos. 753 (3 mismatches)"

