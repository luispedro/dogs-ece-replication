# Mapping from protein families / reference proteins to replication roles and
# mechanisms.  This is the auditable core of the analysis: every entry records
# the role, which mechanisms it can support, how specific that support is, and
# known ambiguities.  Pfam entries are keyed by accession (version-less) and
# were checked against Pfam 38.2 names/descriptions (see `pfam_name`).
#
# specificity:
#   high   - family is defined by experimentally characterised initiators of a
#            single mechanism; a confident hit supports that mechanism.
#   medium - role is clear but the family spans mechanisms, has documented
#            look-alikes (e.g. transfer relaxases), or is poorly characterised.
#   low    - role-level evidence only; never supports a mechanism by itself.
#
# mechanisms: rolling_circle | theta | strand_displacement | protein_primed |
#             host_like (homolog of chromosomal machinery) | unknown
version: "2026-10-28.1"

modules:
  replication: [initiator, helicase, primase, primase_helicase, polymerase, helicase_loader,
                replisome_organiser, ssb, copy_control, terminal_protein, replication_accessory]
  maintenance: [partition_atpase, partition_cbp, partition_other, toxin, antitoxin, multimer_resolution]
  transfer: [relaxase, mob_accessory, coupling_protein, t4ss]
  viral: [terminase, portal, capsid, tail, prohead_protease, head_tail, viral_structural, lysis]
  integration: [integrase, transposase]

# Threshold sets; `default` drives the main results, the others are used for
# the sensitivity analysis.
thresholds:
  default:
    pfam_score: gathering        # per-family GA bit score (sequence and domain)
    pfam_min_hmm_coverage: 0.35  # fraction of the HMM covered by significant domains
    initiator_full_coverage: 0.6 # HMM coverage needed for an initiator to count as complete
    phrog_evalue: 1.0e-5
    phrog_min_hmm_coverage: 0.35
    diamond_evalue: 1.0e-5
    diamond_min_identity: 25
    diamond_min_coverage: 0.5    # on both query and subject
    diamond_system_identity: 50  # identity for a "system-level" (close homolog) match
    diamond_system_coverage: 0.7
  strict:
    pfam_score: gathering_plus_5
    pfam_min_hmm_coverage: 0.5
    initiator_full_coverage: 0.7
    phrog_evalue: 1.0e-10
    phrog_min_hmm_coverage: 0.5
    diamond_evalue: 1.0e-10
    diamond_min_identity: 30
    diamond_min_coverage: 0.6
    diamond_system_identity: 60
    diamond_system_coverage: 0.8
  relaxed:
    pfam_score: evalue_1e-5      # ignore GA; accept any domain with i-Evalue <= 1e-5
    pfam_min_hmm_coverage: 0.25
    initiator_full_coverage: 0.5
    phrog_evalue: 1.0e-3
    phrog_min_hmm_coverage: 0.25
    diamond_evalue: 1.0e-3
    diamond_min_identity: 20
    diamond_min_coverage: 0.4
    diamond_system_identity: 40
    diamond_system_coverage: 0.6

# Element-level combination rules (see evidence.py)
combination:
  # RCR plasmids/viruses are small; larger elements carrying an RCR-type
  # initiator are flagged rather than rejected (cointegrates, ICEs, phages).
  rcr_context_max_length: 25000
  origin_q_threshold: 0.1
  viral_module_min_genes: 2       # viral structural/packaging genes needed for "viral context"
  transfer_context_roles: [coupling_protein, t4ss]
  # Origin features allowed to corroborate an initiator. Only direct repeats are
  # enriched next to candidate initiators relative to control genes in this
  # dataset (results/origins.tsv: DR 26% vs 7.5% of regions at P<0.05; inverted
  # repeats 39% vs 41%; AT-rich windows 40% vs 38%), so hairpins and AT-rich
  # windows are reported but do not upgrade a call.
  origin_support_features: [dr]

